[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-language-learning-tool"
version = "0.3.0"
description = "Windows desktop app for deterministic language-learning sentence sets and resumable TTS audio."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "platformdirs>=4.3,<5",
  "keyring>=25.5,<26",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "edge-tts>=7,<8",
  "Send2Trash>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5,<6",
]
data-build = ["wordfreq>=3.1,<4"]
build = ["nuitka>=2.7,<3", "ordered-set>=4.1,<5"]

[project.scripts]
easy-language-learning-tool = "easy_language_learning_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["easy_language_learning_tool"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "send2trash"]
ignore_missing_imports = true

[tool.coverage.run]
omit = [
  "*/easy_language_learning_tool/app.py",
  "*/easy_language_learning_tool/ui/*",
]
