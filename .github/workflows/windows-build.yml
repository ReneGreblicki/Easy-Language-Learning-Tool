name: Windows build
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "src/**"
      - "resources/**"
      - "assets/**"
      - "examples/**"
      - "pyproject.toml"
      - "installer/**"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install locked build dependencies
        run: uv sync --locked --extra dev --extra build
      - name: Run quality and Windows UI tests
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest --cov=easy_language_learning_tool --cov-report=term-missing --cov-fail-under=85
      - name: Bundle FFmpeg essentials
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $expanded
          $bin = Get-ChildItem $expanded -Directory | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName "bin" }
          Copy-Item (Join-Path $bin "ffmpeg.exe") installer\bundled\ffmpeg\ffmpeg.exe
          Copy-Item (Join-Path $bin "ffprobe.exe") installer\bundled\ffmpeg\ffprobe.exe
      - name: Build standalone application
        shell: pwsh
        run: |
          uv run python -m nuitka --standalone --enable-plugin=pyside6 --windows-console-mode=disable `
            --assume-yes-for-downloads --output-dir=dist `
            --output-filename=EasyLanguageLearningTool.exe `
            --windows-icon-from-ico=assets/icons/logo.ico `
            --include-data-dir=resources=resources `
            --include-data-dir=assets=assets `
            --include-data-dir=examples=examples `
            --include-data-files=README.md=README.md `
            --include-data-files=RELEASE_NOTES.md=RELEASE_NOTES.md `
            src/easy_language_learning_tool/app.py
          $built = Get-ChildItem dist -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $built) { throw "Nuitka standalone directory was not produced." }
          $target = Join-Path (Resolve-Path dist) "EasyLanguageLearningTool"
          Move-Item $built.FullName $target
          $ffmpegTarget = Join-Path $target "installer\bundled\ffmpeg"
          New-Item $ffmpegTarget -ItemType Directory -Force | Out-Null
          Copy-Item installer\bundled\ffmpeg\ffmpeg.exe $ffmpegTarget
          Copy-Item installer\bundled\ffmpeg\ffprobe.exe $ffmpegTarget
      - name: Verify native executable icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $executable = (Resolve-Path dist\EasyLanguageLearningTool\EasyLanguageLearningTool.exe).Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($executable)
          if (-not $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) {
            throw "The packaged executable does not contain a usable native Windows icon."
          }
          $icon.Dispose()
      - name: Validate signing configuration
        id: signing
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Configure both Windows signing secrets or neither of them."
          }
          "enabled=$($hasCertificate.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Sign standalone executable
        if: steps.signing.outputs.enabled == 'true'
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: installer\sign_windows_artifacts.ps1 -Paths dist\EasyLanguageLearningTool\EasyLanguageLearningTool.exe
      - name: Packaged launch smoke test
        shell: pwsh
        run: |
          $process = Start-Process dist\EasyLanguageLearningTool\EasyLanguageLearningTool.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited -and $process.ExitCode -ne 0) { throw "Packaged app exited with code $($process.ExitCode)." }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id }
      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\inno_setup.iss
      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          installer\sign_windows_artifacts.ps1 -Paths $installer.FullName
      - name: Installed application acceptance test
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          installer\windows_acceptance.ps1 -InstallerPath $installer.FullName
      - name: Create build provenance
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $versionMatch) { throw "Project version was not found in pyproject.toml." }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $sourceCommit = if ("${{ github.event_name }}" -eq "pull_request") {
            "${{ github.event.pull_request.head.sha }}"
          } else {
            "${{ github.sha }}"
          }
          @(
            "version=$version",
            "commit=$sourceCommit",
            "workflow_run=${{ github.run_id }}",
            "built_utc=$([DateTime]::UtcNow.ToString('o'))",
            "authenticode_signed=${{ steps.signing.outputs.enabled }}"
          ) | Set-Content dist\installer\BUILD_PROVENANCE.txt
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Set-Content (Join-Path $installer.DirectoryName "SHA256SUMS.txt")
      - uses: actions/upload-artifact@v6
        with:
          name: Easy-Language-Learning-Tool-Windows
          path: |
            dist/installer/*
            dist/EasyLanguageLearningTool/**
