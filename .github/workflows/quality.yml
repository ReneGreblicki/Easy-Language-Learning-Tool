name: Quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pip-audit
      - run: uv run pip-licenses --format=markdown --output-file=third-party-licences.md
      - name: Scan repository for secrets
        shell: pwsh
        run: |
          $version = "8.30.1"
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $destination = Join-Path $env:RUNNER_TEMP "gitleaks"
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "190ad53db301eec3e90afe3a1a75270768b8ebf89e731345e19421c32c1ae1a1"
          if ($actual -ne $expected) { throw "Gitleaks checksum mismatch." }
          Expand-Archive $archive -DestinationPath $destination
          & (Join-Path $destination "gitleaks.exe") detect --source . --redact --verbose
