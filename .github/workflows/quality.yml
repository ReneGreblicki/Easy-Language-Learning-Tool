name: Quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pip-audit
      - run: uv run pip-licenses --format=markdown --output-file=third-party-licences.md
      - name: Scan repository for secrets
        shell: pwsh
        run: |
          $version = "8.30.1"
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $destination = Join-Path $env:RUNNER_TEMP "gitleaks"
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
          if ($actual -ne $expected) { throw "Gitleaks checksum mismatch." }
          Expand-Archive $archive -DestinationPath $destination
          & (Join-Path $destination "gitleaks.exe") detect --source . --redact --verbose
