name: Default deck full generation
on:
  workflow_dispatch:
concurrency:
  group: paid-default-deck-workflows
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: |
            default-deck-full/checkpoints
            default-deck-reviewed/checkpoints
          key: default-deck-full-${{ runner.os }}-${{ hashFiles('tools/build_default_decks.py', 'tools/review_default_deck_curriculum.py', 'tools/default_deck_quality.py', 'resources/frequency_data/production/words.jsonl.gz') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            default-deck-full-${{ runner.os }}-${{ hashFiles('tools/build_default_decks.py', 'tools/review_default_deck_curriculum.py', 'tools/default_deck_quality.py', 'resources/frequency_data/production/words.jsonl.gz') }}-
      - name: Validate the pinned source corpus
        run: >-
          python tools/default_deck_quality.py
          --check-corpus
          --corpus resources/frequency_data/production/words.jsonl.gz
      - name: Verify paid provider credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" || -z "$GOOGLE_TRANSLATE_API_KEY" ]]; then
            echo "::error::OPENAI_API_KEY and GOOGLE_TRANSLATE_API_KEY are required."
            exit 1
          fi
      - name: Generate or resume the full curriculum
        id: generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        shell: bash
        run: |
          set +e
          python tools/build_default_decks.py \
            --pipeline hybrid \
            --model gpt-5.6-luna \
            --editorial-mode selective \
            --max-cost-usd 4.50 \
            --max-google-characters 1200000 \
            --max-google-new-characters 100000 \
            --max-google-requests 1100 \
            --output default-deck-full
          status=$?
          set -e
          if [[ $status -eq 75 ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Generation checkpoint saved. Re-run after the daily quota resets."
          elif [[ $status -ne 0 ]]; then
            exit "$status"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Adjudicate deterministic failures
        if: steps.generation.outputs.complete == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python tools/review_default_deck_curriculum.py
          default-deck-full/curriculum.json
          --hybrid-evidence default-deck-full/hybrid_evidence.json
          --repair-model gpt-4.1-mini
          --escalation-model gpt-4.1-mini
          --max-openai-cost-usd 1.00
          --skip-google
          --output default-deck-reviewed
      - name: Final network-free verification
        if: steps.generation.outputs.complete == 'true'
        run: >-
          python tools/default_deck_quality.py
          default-deck-reviewed/reviewed_curriculum.json
          --hybrid-evidence default-deck-reviewed/hybrid_evidence.json
          --output default-deck-final
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Default-deck-full-generation-${{ github.run_number }}
          path: |
            default-deck-full
            default-deck-reviewed
            default-deck-final
          if-no-files-found: warn
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            default-deck-full/checkpoints
            default-deck-reviewed/checkpoints
          key: default-deck-full-${{ runner.os }}-${{ hashFiles('tools/build_default_decks.py', 'tools/review_default_deck_curriculum.py', 'tools/default_deck_quality.py', 'resources/frequency_data/production/words.jsonl.gz') }}-${{ github.run_id }}-${{ github.run_attempt }}
