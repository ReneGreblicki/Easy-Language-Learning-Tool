name: macOS build
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "feature/apple-platforms"
    paths:
      - "src/**"
      - "resources/**"
      - "assets/**"
      - "examples/**"
      - "pyproject.toml"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "resources/**"
      - "assets/**"
      - "examples/**"
      - "pyproject.toml"
      - "installer/**"
      - ".github/workflows/macos-build.yml"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: Intel
          - runner: macos-15
            architecture: Apple-Silicon
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 || '' }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD || '' }}
      MACOS_KEYCHAIN_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_KEYCHAIN_PASSWORD || '' }}
      MACOS_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.MACOS_SIGNING_IDENTITY || '' }}
      APP_STORE_CONNECT_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ github.event_name != 'pull_request' && secrets.APP_STORE_CONNECT_API_KEY_BASE64 || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install locked build dependencies
        run: uv sync --locked --extra dev --extra build
      - name: Install macOS packaging dependencies
        run: brew install ffmpeg dylibbundler
      - name: Configure optional Developer ID signing
        run: |
          values=(
            "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64"
            "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD"
            "$MACOS_KEYCHAIN_PASSWORD"
            "$MACOS_SIGNING_IDENTITY"
          )
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 4 ]]; then
            echo "::error::Configure all four macOS signing secrets or leave all four unset."
            exit 1
          fi
          if [[ "$configured" -eq 0 ]]; then
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/macos-signing.keychain-db"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          echo "MACOS_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
      - name: Run quality and macOS tests
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest --cov=easy_language_learning_tool --cov-report=term-missing --cov-fail-under=85
      - name: Resolve application version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Create macOS application icon
        run: |
          mkdir -p build/AppIcon.iconset
          sips -z 16 16 assets/icons/logo.png --out build/AppIcon.iconset/icon_16x16.png
          sips -z 32 32 assets/icons/logo.png --out build/AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icons/logo.png --out build/AppIcon.iconset/icon_32x32.png
          sips -z 64 64 assets/icons/logo.png --out build/AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icons/logo.png --out build/AppIcon.iconset/icon_128x128.png
          sips -z 256 256 assets/icons/logo.png --out build/AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icons/logo.png --out build/AppIcon.iconset/icon_256x256.png
          sips -z 512 512 assets/icons/logo.png --out build/AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icons/logo.png --out build/AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icons/logo.png --out build/AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns build/AppIcon.iconset -o build/AppIcon.icns
      - name: Build standalone macOS application
        run: |
          uv run python -m nuitka --standalone --enable-plugin=pyside6 \
            --macos-create-app-bundle --macos-app-name="Easy Language Learning Tool" \
            --macos-app-version="$APP_VERSION" --macos-app-icon=build/AppIcon.icns \
            --output-dir=dist --output-filename=EasyLanguageLearningTool \
            --include-data-dir=resources=resources \
            --include-data-dir=assets=assets \
            --include-data-dir=examples=examples \
            --include-data-files=README.md=README.md \
            --include-data-files=RELEASE_NOTES.md=RELEASE_NOTES.md \
            src/easy_language_learning_tool/app.py
          app_path=$(find dist -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          mv "$app_path" "dist/Easy Language Learning Tool.app"
      - name: Bundle FFmpeg and native libraries
        run: |
          app_path="dist/Easy Language Learning Tool.app"
          target="$app_path/Contents/Resources/installer/bundled/ffmpeg"
          mkdir -p "$target" "$app_path/Contents/Frameworks"
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" "$target/ffmpeg"
          cp "$(brew --prefix ffmpeg)/bin/ffprobe" "$target/ffprobe"
          chmod +x "$target/ffmpeg" "$target/ffprobe"
          dylibbundler -od -b \
            -x "$target/ffmpeg" -x "$target/ffprobe" \
            -d "$app_path/Contents/Frameworks" \
            -p "@executable_path/../Frameworks/"
          if [[ "$MACOS_SIGNING_ENABLED" == "true" ]]; then
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$app_path"
          else
            codesign --force --deep --sign - "$app_path"
          fi
      - name: Validate application bundle
        run: |
          app_path="dist/Easy Language Learning Tool.app"
          plutil -lint "$app_path/Contents/Info.plist"
          codesign --verify --deep --strict "$app_path"
          test -x "$app_path/Contents/Resources/installer/bundled/ffmpeg/ffmpeg"
          test -x "$app_path/Contents/Resources/installer/bundled/ffmpeg/ffprobe"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          file "$app_path/Contents/MacOS/$executable"
          QT_QPA_PLATFORM=offscreen "$app_path/Contents/MacOS/$executable" &
          pid=$!
          sleep 8
          kill "$pid"
          wait "$pid" || true
      - name: Create DMG, checksum, and provenance
        run: |
          mkdir -p dist/dmg-root dist/release
          cp -R "dist/Easy Language Learning Tool.app" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          dmg="dist/release/EasyLanguageLearningTool-$APP_VERSION-${{ matrix.architecture }}.dmg"
          hdiutil create -volname "Easy Language Learning Tool" \
            -srcfolder dist/dmg-root -ov -format UDZO "$dmg"
          signing="ad-hoc"
          notarized="false"
          if [[ "$MACOS_SIGNING_ENABLED" == "true" ]]; then
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
            signing="developer-id"
            notary_values=(
              "$APP_STORE_CONNECT_KEY_ID"
              "$APP_STORE_CONNECT_ISSUER_ID"
              "$APP_STORE_CONNECT_API_KEY_BASE64"
            )
            notary_configured=0
            for value in "${notary_values[@]}"; do
              [[ -n "$value" ]] && notary_configured=$((notary_configured + 1))
            done
            if [[ "$notary_configured" -ne 0 && "$notary_configured" -ne 3 ]]; then
              echo "::error::Configure all three App Store Connect API secrets for notarization."
              exit 1
            fi
            if [[ "$notary_configured" -eq 3 ]]; then
              key="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
              printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key"
              chmod 600 "$key"
              xcrun notarytool submit "$dmg" \
                --key "$key" \
                --key-id "$APP_STORE_CONNECT_KEY_ID" \
                --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
                --wait
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              notarized="true"
            fi
          fi
          shasum -a 256 "$dmg" > "dist/release/SHA256SUMS-${{ matrix.architecture }}.txt"
          printf 'version=%s\ncommit=%s\nworkflow_run=%s\nbuilt_utc=%s\narchitecture=%s\ncodesign=%s\nnotarized=%s\n' \
            "$APP_VERSION" \
            "${{ github.event.pull_request.head.sha || github.sha }}" \
            "${{ github.run_id }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ matrix.architecture }}" \
            "$signing" \
            "$notarized" \
            > "dist/release/BUILD_PROVENANCE-${{ matrix.architecture }}.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: Easy-Language-Learning-Tool-macOS-${{ matrix.architecture }}
          path: dist/release/*
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$MACOS_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/AuthKey_*.p8
