name: Production release
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/apple-platforms"
    tags:
      - "v*"
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/macos-build.yml"

permissions:
  contents: write

jobs:
  frequency-data:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - name: Enforce production frequency corpus
        shell: pwsh
        run: |
          $data = "resources\frequency_data\production\words.jsonl.gz"
          if (-not (Test-Path $data)) { throw "Production frequency corpus is not present." }
          uv run python tools\check_release_data.py $data --minimum 5000
  verify:
    needs: frequency-data
    uses: ./.github/workflows/tests.yml
  package-windows:
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit
  package-android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform shell
        working-directory: android_app
        run: flutter create --platforms=android --org com.renegreblicki .
      - name: Configure Android application
        working-directory: android_app
        run: python tool/configure_android_deep_link.py
      - name: Verify release manifest configuration
        working-directory: android_app
        run: python -m unittest discover -s tool/tests -p "test_*.py"
      - name: Resolve dependencies
        working-directory: android_app
        run: flutter pub get
      - name: Analyze
        working-directory: android_app
        run: flutter analyze
      - name: Test
        working-directory: android_app
        run: flutter test
      - name: Build release APK
        working-directory: android_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: Easy-Language-Learning-Tool-Android-0.2.6
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  package-macos:
    needs: verify
    uses: ./.github/workflows/macos-build.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/feature/apple-platforms'
    needs: [package-windows, package-android, package-macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-Windows
          path: release-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-Android-0.2.6
          path: release-artifacts/android
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-macOS-Apple-Silicon
          path: release-artifacts/macos/apple-silicon
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-macOS-Intel
          path: release-artifacts/macos/intel
      - name: Prepare portable archive
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $versionMatch) { throw "Project version was not found in pyproject.toml." }
          $releaseTag = "v$($versionMatch.Matches[0].Groups[1].Value)"
          Compress-Archive -Path release-artifacts\\EasyLanguageLearningTool `
            -DestinationPath "release-artifacts\\EasyLanguageLearningTool-Portable-$releaseTag.zip"
          Move-Item release-artifacts\\android\\app-release.apk `
            release-artifacts\\android\\EasyLanguageLearningTool-Android-0.2.6.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $versionMatch) { throw "Project version was not found in pyproject.toml." }
          $releaseTag = "v$($versionMatch.Matches[0].Groups[1].Value)"
          $installer = Get-ChildItem release-artifacts\\installer\\*.exe | Select-Object -First 1
          $targetArguments = if ("${{ github.ref }}" -like "refs/tags/v*") {
            @("--verify-tag")
          } else {
            @("--target", "${{ github.sha }}")
          }
          $assets = @(
            $installer.FullName,
            "release-artifacts\\installer\\SHA256SUMS.txt",
            "release-artifacts\\installer\\BUILD_PROVENANCE.txt",
            "release-artifacts\\EasyLanguageLearningTool-Portable-$releaseTag.zip",
            "release-artifacts\\android\\EasyLanguageLearningTool-Android-0.2.6.apk"
          )
          $assets += Get-ChildItem release-artifacts\\macos -Recurse -File | ForEach-Object { $_.FullName }
          gh release view "$releaseTag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$releaseTag" @assets --clobber
          } else {
            gh release create "$releaseTag" @assets `
              --title "Easy Language Learning Tool $releaseTag" `
              --notes-file RELEASE_NOTES.md `
              @targetArguments
          }
