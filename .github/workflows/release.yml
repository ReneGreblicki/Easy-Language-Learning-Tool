name: Production release
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  frequency-data:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - name: Enforce production frequency corpus
        shell: pwsh
        run: |
          $data = "resources\frequency_data\production\words.jsonl.gz"
          if (-not (Test-Path $data)) { throw "Production frequency corpus is not present." }
          uv run python tools\check_release_data.py $data --minimum 5000
  verify:
    needs: frequency-data
    uses: ./.github/workflows/tests.yml
  package:
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: package
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-Windows
          path: release-artifacts
      - name: Prepare portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path release-artifacts\\EasyLanguageLearningTool `
            -DestinationPath release-artifacts\\EasyLanguageLearningTool-Portable-${{ env.RELEASE_TAG }}.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-artifacts\\installer\\*.exe | Select-Object -First 1
          gh release create "${{ env.RELEASE_TAG }}" `
            $installer.FullName `
            release-artifacts\\installer\\SHA256SUMS.txt `
            release-artifacts\\installer\\BUILD_PROVENANCE.txt `
            release-artifacts\\EasyLanguageLearningTool-Portable-${{ env.RELEASE_TAG }}.zip `
            --title "Easy Language Learning Tool ${{ env.RELEASE_TAG }}" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
