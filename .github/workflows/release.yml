name: Production release
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/android-sync"
    tags:
      - "v*"
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  frequency-data:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - name: Enforce production frequency corpus
        shell: pwsh
        run: |
          $data = "resources\frequency_data\production\words.jsonl.gz"
          if (-not (Test-Path $data)) { throw "Production frequency corpus is not present." }
          uv run python tools\check_release_data.py $data --minimum 5000
  verify:
    needs: frequency-data
    uses: ./.github/workflows/tests.yml
  package-windows:
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit
  package-macos:
    needs: verify
    uses: ./.github/workflows/macos-build.yml
  package-android:
    needs: verify
    uses: ./.github/workflows/android.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/feature/android-sync'
    needs: [package-windows, package-macos, package-android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-Windows
          path: release-artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: Easy-Language-Learning-Tool-macOS-*
          path: release-artifacts/macos
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-Android-0.2.6
          path: release-artifacts/android
      - name: Prepare portable archive
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $versionMatch) { throw "Project version was not found in pyproject.toml." }
          $releaseTag = "v$($versionMatch.Matches[0].Groups[1].Value)"
          Compress-Archive -Path release-artifacts\\EasyLanguageLearningTool `
            -DestinationPath "release-artifacts\\EasyLanguageLearningTool-Portable-$releaseTag.zip"
          Move-Item release-artifacts\\android\\app-release.apk `
            release-artifacts\\android\\EasyLanguageLearningTool-Android-0.2.6.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $versionMatch) { throw "Project version was not found in pyproject.toml." }
          $releaseTag = "v$($versionMatch.Matches[0].Groups[1].Value)"
          $installer = Get-ChildItem release-artifacts\\installer\\*.exe | Select-Object -First 1
          $targetArguments = if ("${{ github.ref }}" -like "refs/tags/v*") {
            @("--verify-tag")
          } else {
            @("--target", "${{ github.sha }}")
          }
          gh release create "$releaseTag" `
            $installer.FullName `
            release-artifacts\\installer\\SHA256SUMS.txt `
            release-artifacts\\installer\\BUILD_PROVENANCE.txt `
            "release-artifacts\\EasyLanguageLearningTool-Portable-$releaseTag.zip" `
            release-artifacts\\android\\EasyLanguageLearningTool-Android-0.2.6.apk `
            release-artifacts\\macos\\*.dmg `
            release-artifacts\\macos\\SHA256SUMS-*.txt `
            release-artifacts\\macos\\BUILD_PROVENANCE-*.txt `
            --title "Easy Language Learning Tool $releaseTag" `
            --notes-file RELEASE_NOTES.md `
            @targetArguments
