name: Production release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frequency-data:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - name: Enforce production frequency corpus
        shell: pwsh
        run: |
          $data = "resources\frequency_data\production\words.jsonl.gz"
          if (-not (Test-Path $data)) { throw "Production frequency corpus is not present." }
          uv run python tools\check_release_data.py $data --minimum 5000
  verify:
    needs: frequency-data
    uses: ./.github/workflows/tests.yml
  package-windows:
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit
  package-macos:
    needs: verify
    uses: ./.github/workflows/macos-build.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows, package-macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Easy-Language-Learning-Tool-Windows
          path: release-artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: Easy-Language-Learning-Tool-macOS-*
          path: release-artifacts/macos
          merge-multiple: true
      - name: Prepare portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path release-artifacts\\EasyLanguageLearningTool `
            -DestinationPath release-artifacts\\EasyLanguageLearningTool-Portable-${{ github.ref_name }}.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-artifacts\\installer\\*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" `
            $installer.FullName `
            release-artifacts\\installer\\SHA256SUMS.txt `
            release-artifacts\\installer\\BUILD_PROVENANCE.txt `
            release-artifacts\\EasyLanguageLearningTool-Portable-${{ github.ref_name }}.zip `
            release-artifacts\\macos\\*.dmg `
            release-artifacts\\macos\\SHA256SUMS-*.txt `
            release-artifacts\\macos\\BUILD_PROVENANCE-*.txt `
            --title "Easy Language Learning Tool ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
