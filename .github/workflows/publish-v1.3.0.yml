name: Publish v1.3.0
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.3.0.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.3.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            -f ref=refs/tags/v1.3.0 \
            -f sha=${{ github.sha }}
