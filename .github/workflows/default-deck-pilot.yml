name: Default deck content pilot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/build_default_decks.py'
      - 'tools/audit_default_deck_curriculum.py'
      - 'tools/default_deck_quality.py'
      - 'tools/review_default_deck_curriculum.py'
      - '.github/workflows/default-deck-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate the pinned 120,000-row source corpus
        run: >-
          python tools/default_deck_quality.py
          --check-corpus
          --corpus resources/frequency_data/production/words.jsonl.gz
      - name: Generate thirty concepts in every supported language and script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python tools/build_default_decks.py
          --pilot
          --model gpt-4o-mini
          --editorial-mode selective
          --output default-deck-pilot
      - name: Selectively repair and independently back-translate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: >-
          python tools/review_default_deck_curriculum.py
          default-deck-pilot/curriculum.json
          --repair-model gpt-4.1
          --output default-deck-reviewed
      - name: Final network-free verification
        run: >-
          python tools/default_deck_quality.py
          default-deck-reviewed/reviewed_curriculum.json
          --backtranslations default-deck-reviewed/independent_backtranslations.json
          --output default-deck-final
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Default-deck-content-pilot
          path: |
            default-deck-pilot
            default-deck-reviewed
            default-deck-final
          if-no-files-found: warn
