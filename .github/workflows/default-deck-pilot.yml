name: Default deck content pilot
on:
  workflow_dispatch:
concurrency:
  group: paid-default-deck-workflows
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: |
            default-deck-pilot/checkpoints
            default-deck-reviewed/checkpoints
          key: default-deck-paid-${{ runner.os }}-${{ hashFiles('tools/build_default_decks.py', 'tools/review_default_deck_curriculum.py', 'tools/default_deck_quality.py', 'resources/frequency_data/production/words.jsonl.gz') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            default-deck-paid-${{ runner.os }}-${{ hashFiles('tools/build_default_decks.py', 'tools/review_default_deck_curriculum.py', 'tools/default_deck_quality.py', 'resources/frequency_data/production/words.jsonl.gz') }}-
      - name: Validate the pinned 120,000-row source corpus
        run: >-
          python tools/default_deck_quality.py
          --check-corpus
          --corpus resources/frequency_data/production/words.jsonl.gz
      - name: Verify independent translation credential
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_TRANSLATE_API_KEY" ]]; then
            echo "::error::Add the GOOGLE_TRANSLATE_API_KEY repository secret before running the paid content review."
            exit 1
          fi
      - name: Generate English, translate with Google, and post-edit with Luna
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: >-
          python tools/build_default_decks.py
          --pilot
          --pipeline hybrid
          --model gpt-5.6-luna
          --editorial-mode selective
          --max-cost-usd 0.50
          --max-google-characters 100000
          --max-google-requests 48
          --output default-deck-pilot
      - name: Adjudicate only deterministic failures
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python tools/review_default_deck_curriculum.py
          default-deck-pilot/curriculum.json
          --hybrid-evidence default-deck-pilot/hybrid_evidence.json
          --repair-model gpt-4.1-mini
          --escalation-model gpt-4.1-mini
          --max-openai-cost-usd 0.50
          --skip-google
          --output default-deck-reviewed
      - name: Final network-free verification
        run: >-
          python tools/default_deck_quality.py
          default-deck-reviewed/reviewed_curriculum.json
          --hybrid-evidence default-deck-reviewed/hybrid_evidence.json
          --output default-deck-final
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Default-deck-content-pilot
          path: |
            default-deck-pilot
            default-deck-reviewed
            default-deck-final
          if-no-files-found: warn
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            default-deck-pilot/checkpoints
            default-deck-reviewed/checkpoints
          key: default-deck-paid-${{ runner.os }}-${{ hashFiles('tools/build_default_decks.py', 'tools/review_default_deck_curriculum.py', 'tools/default_deck_quality.py', 'resources/frequency_data/production/words.jsonl.gz') }}-${{ github.run_id }}-${{ github.run_attempt }}
