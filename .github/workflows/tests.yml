name: Tests
on:
  push:
  pull_request:
  workflow_call:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest --cov=easy_language_learning_tool --cov-report=term-missing --cov-fail-under=85
