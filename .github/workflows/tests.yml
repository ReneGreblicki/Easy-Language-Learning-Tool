name: Tests
on:
  push:
  pull_request:
  workflow_call:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest --cov=easy_language_learning_tool --cov-report=term-missing --cov-fail-under=85
